{% extends "base.html" %}
{% block title %}Signup{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create account</h1>
  <form method="post" class="form-grid">
    <label class="full">Name<input name="name" required minlength="2" /></label>
    <label class="full">Email<input type="email" name="email" required /></label>
    <label class="full">Password<input type="password" name="password" required minlength="6" /></label>
    <div class="full actions"><button class="btn btn-primary" type="submit">Signup</button></div>
  </form>
</section>
{% endblock %}
